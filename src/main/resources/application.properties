quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.devservices.image-name=docker.io/postgis/postgis:16-3.5
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.schema-management.create-schemas=false
quarkus.datasource.devservices.init-script-path=structure.sql
quarkus.http.port=8085

osrm.openlr.router.host=http://localhost:5001
osrm.distance.router.host=http://localhost:5002

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${quarkus.application.name:osrm-matching},%X{traceId},%X{spanId},%X{spanExportable}] --- [%t-%t{id}] %-40.40c{1.} : %s%n%e

quarkus.otel.logs.enabled=true
quarkus.otel.logs.exporter=none
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=none
quarkus.otel.traces.enabled=true
quarkus.otel.traces.exporter=none

quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=mobidrom/verkehr.nrw-osrm-matching
